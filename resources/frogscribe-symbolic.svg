<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- FrogScribe GNOME panel icon: frog face, single color -->
  <g fill="#ffffff">
    <!-- Left eye (protruding circle above head) -->
    <circle cx="4.5" cy="4" r="2.5"/>
    <!-- Right eye (protruding circle above head) -->
    <circle cx="11.5" cy="4" r="2.5"/>
    <!-- Left pupil (cutout) -->
    <circle cx="4.5" cy="4.3" r="1" fill="#000000"/>
    <!-- Right pupil (cutout) -->
    <circle cx="11.5" cy="4.3" r="1" fill="#000000"/>
    <!-- Head/jaw (wide rounded rectangle) -->
    <rect x="1.5" y="5.5" width="13" height="8" rx="4"/>
    <!-- Nostrils -->
    <circle cx="5.5" cy="8" r="0.7" fill="#000000"/>
    <circle cx="10.5" cy="8" r="0.7" fill="#000000"/>
    <!-- Wide mouth (smile) -->
    <path d="M4,11 Q8,14 12,11" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
